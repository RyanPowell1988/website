<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ryan — San Jose</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #06060b;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f4f4f7;
      --muted: #9ca3af;
      --cyan: #00f0ff;
      --magenta: #ff2a85;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      overflow-x: hidden;
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Fullscreen Fractal Mountain Canvas */
    #mountain-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Ambient vignette over canvas */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 25%, transparent 25%, rgba(6, 6, 11, 0.7) 100%),
        linear-gradient(to bottom, rgba(6, 6, 11, 0.2) 0%, rgba(6, 6, 11, 0.65) 75%, #06060b 100%);
    }

    .wrapper {
      position: relative;
      z-index: 2;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 0;
    }

    .logo {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
    }

    .logo span {
      color: var(--cyan);
    }

    .nav-cta {
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      background: rgba(0, 240, 255, 0.08);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: all 0.25s ease;
    }

    .nav-cta:hover {
      border-color: var(--cyan);
      background: rgba(0, 240, 255, 0.18);
      box-shadow: 0 0 22px rgba(0, 240, 255, 0.25);
    }

    /* Hero */
    .hero {
      min-height: calc(100vh - 96px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0 90px;
    }

    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 18px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .eyebrow::before {
      content: "";
      width: 24px;
      height: 1px;
      background: linear-gradient(90deg, var(--magenta), var(--cyan));
    }

    h1 {
      font-family: "Syne", sans-serif;
      font-size: clamp(3.4rem, 10vw, 7rem);
      font-weight: 800;
      line-height: 0.96;
      letter-spacing: -0.03em;
      margin-bottom: 22px;
      background: linear-gradient(135deg, #ffffff 35%, #b8c7ff 75%, #00f0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: clamp(1.1rem, 2.2vw, 1.4rem);
      font-weight: 300;
      color: #d1d5db;
      max-width: 520px;
      margin-bottom: 38px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      color: #06060b;
      background: linear-gradient(135deg, var(--cyan), #7df9ff);
      box-shadow: 0 8px 30px rgba(0, 240, 255, 0.28);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 36px rgba(0, 240, 255, 0.45);
    }

    /* Full-bleed Bottom Image Section */
    .full-bleed {
      position: relative;
      z-index: 2;
      width: 100%;
      height: clamp(460px, 82vh, 920px);
      overflow: hidden;
      background: var(--bg);
    }

    .full-bleed img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 22%;
      filter: contrast(1.05) saturate(1.06);
    }

    /* Seamless top fade from mountains & subtle bottom legibility fade */
    .full-bleed::before,
    .full-bleed::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: 2;
    }

    .full-bleed::before {
      top: 0;
      height: 26%;
      background: linear-gradient(to bottom, #06060b 0%, rgba(6, 6, 11, 0.55) 45%, transparent 100%);
    }

    .full-bleed::after {
      bottom: 0;
      height: 30%;
      background: linear-gradient(to top, rgba(6, 6, 11, 0.88) 0%, rgba(6, 6, 11, 0.4) 55%, transparent 100%);
    }

    /* Fallback if cyberpunk.jpg isn't placed next to index.html yet */
    .bleed-fallback {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background:
        radial-gradient(circle at 70% 35%, rgba(255, 42, 133, 0.16), transparent 50%),
        radial-gradient(circle at 30% 65%, rgba(0, 240, 255, 0.14), transparent 50%),
        #090a12;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .bleed-fallback code {
      font-family: "JetBrains Mono", monospace;
      color: var(--cyan);
      background: rgba(0, 0, 0, 0.45);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .full-bleed.is-missing img {
      display: none;
    }

    .full-bleed.is-missing .bleed-fallback {
      display: flex;
    }

    /* Minimal Footer overlaid at the bottom of the full-bleed image */
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 3;
    }

    .footer-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      color: rgba(244, 244, 247, 0.78);
      font-size: 0.88rem;
    }

    footer a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid rgba(0, 240, 255, 0.45);
      padding-bottom: 2px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    footer a:hover {
      color: var(--cyan);
      border-color: var(--cyan);
    }

    @media (max-width: 768px) {
      .hero {
        min-height: auto;
        padding: 64px 0 84px;
      }
      .full-bleed {
        height: 62vh;
        min-height: 380px;
      }
    }
  </style>
</head>
<body>
  <canvas id="mountain-canvas"></canvas>
  <div class="vignette"></div>

  <div class="wrapper">
    <header>
      <a href="#" class="logo">RYAN<span>.</span></a>
      <a
        href="https://forms.gle/WjvSiqeHdHDRvyKB7"
        target="_blank"
        rel="noopener noreferrer"
        class="nav-cta"
      >
        Contact
      </a>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow">San Jose, CA</div>
        <h1>Ryan</h1>
        <p class="subtitle">Comms &amp; Marketing.</p>
        <a
          href="https://forms.gle/WjvSiqeHdHDRvyKB7"
          target="_blank"
          rel="noopener noreferrer"
          class="btn-primary"
        >
          Get in Touch
          <span aria-hidden="true">&rarr;</span>
        </a>
      </section>
    </main>
  </div>

  <section class="full-bleed">
    <img
      src="cyberpunk.jpg"
      alt="Cyberpunk cityscape balcony"
      onerror="this.parentElement.classList.add('is-missing')"
    />
    <div class="bleed-fallback">
      <code>cyberpunk.jpg</code>
      <span>Place your image next to index.html</span>
    </div>

    <footer>
      <div class="footer-inner">
        <span>Ryan &middot; Comms &amp; Marketing &middot; San Jose</span>
        <a
          href="https://forms.gle/WjvSiqeHdHDRvyKB7"
          target="_blank"
          rel="noopener noreferrer"
        >
          Contact Form
        </a>
      </div>
    </footer>
  </section>

  <script>
    // Real-time Ridged Multifractal Mountain Renderer
    (function () {
      const canvas = document.getElementById("mountain-canvas");
      const ctx = canvas.getContext("2d");

      let width = 0;
      let height = 0;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);
      let mouseX = 0;
      let mouseY = 0;
      let targetMouseX = 0;
      let targetMouseY = 0;
      let time = 0;

      function hash(x, y) {
        const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
        return h - Math.floor(h);
      }

      function fade(t) {
        return t * t * t * (t * (t * 6 - 15) + 10);
      }

      function noise2D(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const fx = fade(x - ix);
        const fy = fade(y - iy);

        const a = hash(ix, iy);
        const b = hash(ix + 1, iy);
        const c = hash(ix, iy + 1);
        const d = hash(ix + 1, iy + 1);

        const ab = a + (b - a) * fx;
        const cd = c + (d - c) * fx;
        return ab + (cd - ab) * fy;
      }

      function ridgedFractal(x, z) {
        let sum = 0;
        let amp = 0.55;
        let freq = 1.0;
        let weight = 1.0;

        for (let i = 0; i < 6; i++) {
          let n = noise2D(x * freq, z * freq);
          n = 1.0 - Math.abs(n * 2.0 - 1.0);
          n = n * n * weight;
          weight = Math.min(1.0, Math.max(0.0, n * 1.8));
          sum += n * amp;
          freq *= 2.08;
          amp *= 0.48;
        }
        return sum;
      }

      const stars = Array.from({ length: 110 }, (_, i) => ({
        x: hash(i, 1.3),
        y: hash(i, 4.7) * 0.52,
        r: 0.4 + hash(i, 9.1) * 1.15,
        phase: hash(i, 2.2) * Math.PI * 2,
      }));

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("mousemove", (e) => {
        targetMouseX = (e.clientX / width - 0.5) * 2;
        targetMouseY = (e.clientY / height - 0.5) * 2;
      });

      resize();

      function render() {
        time += 0.0018;
        mouseX += (targetMouseX - mouseX) * 0.05;
        mouseY += (targetMouseY - mouseY) * 0.05;

        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#05050a");
        sky.addColorStop(0.5, "#0a0c1b");
        sky.addColorStop(1, "#06060b");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        const glow = ctx.createRadialGradient(
          width * 0.55 - mouseX * 25,
          height * 0.46 - mouseY * 12,
          20,
          width * 0.55,
          height * 0.48,
          Math.max(width, height) * 0.65
        );
        glow.addColorStop(0, "rgba(0, 240, 255, 0.12)");
        glow.addColorStop(0.45, "rgba(255, 42, 133, 0.07)");
        glow.addColorStop(1, "transparent");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);

        for (const s of stars) {
          const twinkle = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(time * 18 + s.phase));
          ctx.fillStyle = `rgba(225, 238, 255, ${twinkle})`;
          ctx.beginPath();
          ctx.arc(
            s.x * width - mouseX * 8,
            s.y * height - mouseY * 5,
            s.r,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }

        const layers = 15;
        const stepX = Math.max(6, Math.floor(width / 150));

        for (let l = 0; l < layers; l++) {
          const t = l / (layers - 1);
          const baseY = height * (0.38 + t * 0.52) - mouseY * (6 + t * 24);
          const ridgeAmp = height * (0.14 + t * 0.19);
          const scaleX = 0.0024 + t * 0.0014;
          const parallaxX = mouseX * (15 + t * 65);
          const zSeed = l * 3.17 + time * (0.15 + t * 0.25);

          ctx.beginPath();
          ctx.moveTo(-10, height + 10);

          const points = [];
          for (let x = -10; x <= width + stepX; x += stepX) {
            const nx = (x + parallaxX) * scaleX + l * 1.4;
            const elev = ridgedFractal(nx, zSeed);
            const y = baseY - elev * ridgeAmp;
            points.push({ x, y });
            ctx.lineTo(x, y);
          }

          ctx.lineTo(width + 10, height + 10);
          ctx.closePath();

          const shade = Math.round(18 - t * 12);
          const blue = Math.round(36 - t * 24);
          const layerGrad = ctx.createLinearGradient(0, baseY - ridgeAmp, 0, height);
          layerGrad.addColorStop(0, `rgb(${shade}, ${shade + 4}, ${blue})`);
          layerGrad.addColorStop(0.65, `rgb(${Math.max(6, shade - 6)}, ${Math.max(6, shade - 5)}, ${Math.max(11, blue - 14)})`);
          layerGrad.addColorStop(1, "#06060b");
          ctx.fillStyle = layerGrad;
          ctx.fill();

          ctx.beginPath();
          for (let i = 0; i < points.length; i++) {
            if (i === 0) ctx.moveTo(points[i].x, points[i].y);
            else ctx.lineTo(points[i].x, points[i].y);
          }

          const rimAlpha = 0.12 + t * 0.35;
          const rimGrad = ctx.createLinearGradient(0, 0, width, 0);
          rimGrad.addColorStop(0, `rgba(255, 42, 133, ${rimAlpha * 0.8})`);
          rimGrad.addColorStop(0.5, `rgba(0, 240, 255, ${rimAlpha})`);
          rimGrad.addColorStop(1, `rgba(255, 42, 133, ${rimAlpha * 0.7})`);

          ctx.strokeStyle = rimGrad;
          ctx.lineWidth = 0.8 + t * 0.9;
          ctx.stroke();
        }

        requestAnimationFrame(render);
      }

      render();
    })();
  </script>
</body>
</html>
